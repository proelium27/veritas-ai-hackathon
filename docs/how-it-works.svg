<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1250" viewBox="160 8 1180 1250" role="img" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
<title>Flowchart of how the picker chooses a Serbian translation</title>
<desc>The user enters a Mandarin sentence and sets the speaker gender, listener gender and formality. NLLB writes 32 Serbian translations, ranked from most to least likely. Take one option, starting with the most likely. Labels fit (speaker, listener, formal)? Yes: use this translation. No: sentences left out of the 32? Yes: take the next option. No: repair the best option. Labels fit now? Yes: use the repaired translation. No: use the best option with a "had to guess" warning. The Serbian translation is shown to the user. End.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#1A1A1A"/></marker></defs>
<rect x="160" y="8" width="1180" height="1250" fill="#FFFFFF"/>

