<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1220" viewBox="0 0 860 1220" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="none">
<title>Flowchart of how the picker chooses a Serbian translation</title>
<desc>Start. Input: a Mandarin sentence and who is talking. NLLB writes 32 Serbian options, most likely first. Take the next option. Find the helper word: sam (I am) for the speaker, si (you are) for the listener. Read the endings: -o or -ao for a man, -la for a woman. Read the words for "you": Vi, Vaš, ste formal; ti, tvoj, verbs in -š casual. Decision: do the labels fit? Yes: keep this option (37 of 40 test sentences). No: decision: options left? Yes: take the next option. No: repair the endings with the rule table. Decision: fits now? Yes: use the repaired sentence (2 of 40). No: use the top answer with a "had to guess" warning (1 of 40). Output: the Serbian translation. End.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#1F1F1F"/></marker></defs>
<rect width="860" height="1220" fill="#FFFFFF"/>

<g stroke="#1F1F1F" stroke-width="1.4" marker-end="url(#a)">
<line x1="300" y1="64" x2="300" y2="84"/>
<line x1="300" y1="142" x2="300" y2="162"/>
<line x1="300" y1="218" x2="300" y2="240"/>
<line x1="300" y1="296" x2="300" y2="318"/>
<line x1="300" y1="374" x2="300" y2="396"/>
<line x1="300" y1="452" x2="300" y2="474"/>
<line x1="300" y1="530" x2="300" y2="552"/>
<line x1="410" y1="604" x2="558" y2="604"/>
<line x1="300" y1="654" x2="300" y2="678"/>
<path d="M190 728 H60 V269 H108"/>
<line x1="300" y1="776" x2="300" y2="800"/>
<line x1="300" y1="856" x2="300" y2="878"/>
<line x1="410" y1="930" x2="558" y2="930"/>
<line x1="300" y1="980" x2="300" y2="1004"/>
<line x1="300" y1="1060" x2="300" y2="1080"/>
<path d="M790 604 H824 V1109 H482"/>
<line x1="300" y1="1136" x2="300" y2="1156"/>
</g>
<line x1="790" y1="930" x2="824" y2="930" stroke="#1F1F1F" stroke-width="1.4"/>

<g stroke="#1F1F1F" stroke-width="1.4" fill="#FFFFFF">
<rect x="230" y="24" width="140" height="40" rx="20"/>
<polygon points="130,86 490,86 470,142 110,142"/>
<rect x="110" y="164" width="380" height="54"/>
<rect x="110" y="242" width="380" height="54"/>
<rect x="110" y="320" width="380" height="54"/>
<rect x="110" y="398" width="380" height="54"/>
<rect x="110" y="476" width="380" height="54"/>
<polygon points="300,554 410,604 300,654 190,604"/>
<rect x="560" y="577" width="230" height="54"/>
<polygon points="300,680 410,728 300,776 190,728"/>
<rect x="110" y="802" width="380" height="54"/>
<polygon points="300,880 410,930 300,980 190,930"/>
<rect x="560" y="903" width="230" height="54"/>
<rect x="110" y="1006" width="380" height="54"/>
<polygon points="130,1082 490,1082 470,1136 110,1136"/>
<rect x="230" y="1158" width="140" height="40" rx="20"/>
</g>

<g text-anchor="middle" dominant-baseline="central">
<g fill="#1F1F1F">
<text x="300" y="44">Start</text>
<text x="300" y="105">Mandarin sentence + who's talking</text>
<text x="300" y="182">NLLB writes 32 Serbian options</text>
<text x="300" y="260">Take the next option</text>
<text x="300" y="338">Find the helper word</text>
<text x="300" y="416">Read the endings next to it</text>
<text x="300" y="494">Read the words for “you”</text>
<text x="300" y="595">Labels fit?</text>
<text x="675" y="595">Keep this option</text>
<text x="300" y="719">Options left?</text>
<text x="300" y="820">Repair the endings</text>
<text x="300" y="921">Fits now?</text>
<text x="675" y="921">Use the repaired sentence</text>
<text x="300" y="1024">Use the top answer + warning</text>
<text x="300" y="1101">Serbian translation</text>
<text x="300" y="1178">End</text>
</g>
<g fill="#666666" font-size="13">
<text x="300" y="125">e.g. 我已经检查过了 · speaker: woman</text>
<text x="300" y="202">ranked from most to least likely</text>
<text x="300" y="280">starting with the most likely</text>
<text x="300" y="358">sam (I am) → speaker · si (you are) → listener</text>
<text x="300" y="436">-o, -ao → man (proverio) · -la → woman (proverila)</text>
<text x="300" y="514">Vi, Vaš, ste → formal · ti, tvoj, -š verbs → casual</text>
<text x="300" y="613">speaker, listener, formal</text>
<text x="675" y="615">37 of 40 test sentences</text>
<text x="300" y="737">out of the 32</text>
<text x="300" y="840">proverio → proverila · ti → Vi · tvoj → Vaš</text>
<text x="300" y="939">check again</text>
<text x="675" y="941">2 of 40 test sentences</text>
<text x="300" y="1044">flagged “had to guess” · 1 of 40</text>
<text x="300" y="1120">shown to the user</text>
</g>
</g>

<g fill="#1F1F1F" font-size="13">
<text x="420" y="594">Yes</text>
<text x="310" y="667">No</text>
<text x="150" y="718">Yes</text>
<text x="310" y="789">No</text>
<text x="420" y="920">Yes</text>
<text x="310" y="993">No</text>
</g>
</svg>
