<rect x="411" y="1163" width="237" height="82" rx="18" fill="#DCEAD5"/>
</g>

<g fill="#1A1A1A" dominant-baseline="central">
<text x="529" y="49" font-size="29">Mandarin sentence</text>
<text x="529" y="80" font-size="17">The user enters a Mandarin sentence and sets the</text>
<text x="529" y="104" font-size="17">speaker gender, listener gender, and formality</text>
<text x="529" y="190" font-size="23">NLLB writes 32 Serbian translations</text>
<text x="529" y="217" font-size="17">Sentences are ranked from most to least likely</text>
<text x="529" y="307" font-size="23">Take one option</text>
<text x="529" y="333" font-size="17">Start with the most likely, verify labels</text>
<text x="529" y="421" font-size="23">Labels fit?</text>
<text x="529" y="447" font-size="17">Speaker, listener,</text>
<text x="529" y="471" font-size="17">formal</text>
<text x="1070" y="445" font-size="23">Use this translation</text>
<text x="529" y="582" font-size="23">Sentences left?</text>
<text x="529" y="608" font-size="17">Out of the 32</text>
<text x="529" y="710" font-size="23">Repair best option</text>
<text x="529" y="735" font-size="17">Make slight adjustments to labels</text>
<text x="529" y="847" font-size="23">Labels fit now?</text>
<text x="1070" y="833" font-size="23">Use the repaired</text>
<text x="1070" y="862" font-size="23">translation</text>
<text x="529" y="962" font-size="23">Use the best option</text>
<text x="529" y="987" font-size="17">Add a warning: “had to guess”</text>
<text x="529" y="1078" font-size="31">Serbian translation</text>
<text x="529" y="1107" font-size="17">Shown to the user</text>
<text x="529" y="1204" font-size="31">End</text>
</g>

