<svg xmlns="http://www.w3.org/2000/svg" width="900" height="840" viewBox="0 0 900 840" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How the picker chooses a translation</title>
<desc>NLLB writes 32 Serbian options. For each option, best first: find the helper word (sam or si), read the endings next to it for gender, and read the words for "you" for formality. Match: do all labels fit? Yes: pick it (37 of 40 test sentences). No: try the next option. If none fit, Repair rewrites the endings. Fits now: use it, marked repaired (2 of 40). Otherwise NLLB's top answer with a "had to guess" warning (1 of 40).</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="840" fill="#FFFFFF"/>

<text x="40" y="48" font-size="22" font-weight="600" fill="#1F1E1C">How the picker chooses a translation</text>
<text x="40" y="74" font-size="14" fill="#6B6A65">Every rule and word list comes from our Serbian speaker.</text>

<rect x="40" y="100" width="370" height="60" rx="12" fill="#FFFFFF" stroke="#E4E2DA"/>
<text x="64" y="125" font-size="15" font-weight="600" fill="#1F1E1C">Mandarin + who's talking</text>
<text x="64" y="146" font-size="13" fill="#6B6A65">我已经检查过了 · woman speaker</text>
<line x1="418" y1="130" x2="478" y2="130" stroke="#B4B2A9" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="490" y="100" width="370" height="60" rx="12" fill="#FFFFFF" stroke="#E4E2DA"/>
<text x="514" y="125" font-size="15" font-weight="600" fill="#1F1E1C">NLLB writes 32 Serbian options</text>
<text x="514" y="146" font-size="13" fill="#6B6A65">ranked from most to least likely</text>

<line x1="675" y1="168" x2="675" y2="190" stroke="#B4B2A9" stroke-width="1.6" marker-end="url(#a)"/>

<rect x="40" y="198" width="820" height="372" rx="16" fill="#F6F5F1"/>
<text x="64" y="226" font-size="12" font-weight="600" fill="#888780" letter-spacing="0.6">FOR EACH OPTION, BEST FIRST</text>

<g>
<rect x="64" y="242" width="772" height="68" rx="10" fill="#FFFFFF" stroke="#E4E2DA"/>
<circle cx="96" cy="276" r="14" fill="#EEEDFE"/><text x="96" y="281" font-size="13" font-weight="600" fill="#534AB7" text-anchor="middle">1</text>
<text x="124" y="270" font-size="15" font-weight="600" fill="#1F1E1C">Find the helper word</text>
<text x="124" y="291" font-size="13" fill="#6B6A65">where Serbian shows gender</text>
<text x="420" y="270" font-size="13" fill="#3D3D3A"><tspan font-style="italic">sam</tspan> (I am) → speaker · <tspan font-style="italic">si</tspan> (you are) → listener</text>
<text x="420" y="291" font-size="13" fill="#888780">skips <tspan font-style="italic">Sam</tspan> = “alone”; stops at <tspan font-style="italic">da</tspan>, <tspan font-style="italic">što</tspan> or a comma</text>
</g>
<g>
<rect x="64" y="320" width="772" height="68" rx="10" fill="#FFFFFF" stroke="#E4E2DA"/>
<circle cx="96" cy="354" r="14" fill="#EEEDFE"/><text x="96" y="359" font-size="13" font-weight="600" fill="#534AB7" text-anchor="middle">2</text>
<text x="124" y="348" font-size="15" font-weight="600" fill="#1F1E1C">Read the endings</text>
<text x="124" y="369" font-size="13" fill="#6B6A65">speaker and listener gender</text>
<text x="420" y="348" font-size="13" fill="#3D3D3A">-o, -ao → man (<tspan font-style="italic">proverio</tspan>) · -la → woman (<tspan font-style="italic">proverila</tspan>)</text>
<text x="420" y="369" font-size="13" fill="#888780">word list <tspan font-style="italic">umoran / umorna</tspan>; skips <tspan font-style="italic">posao</tspan>, <tspan font-style="italic">škola</tspan></text>
</g>
<g>
<rect x="64" y="398" width="772" height="68" rx="10" fill="#FFFFFF" stroke="#E4E2DA"/>
<circle cx="96" cy="432" r="14" fill="#EEEDFE"/><text x="96" y="437" font-size="13" font-weight="600" fill="#534AB7" text-anchor="middle">3</text>
<text x="124" y="426" font-size="15" font-weight="600" fill="#1F1E1C">Read the words for “you”</text>
<text x="124" y="447" font-size="13" fill="#6B6A65">formal or casual</text>
<text x="420" y="426" font-size="13" fill="#3D3D3A"><tspan font-style="italic">Vi, Vaš, ste</tspan> → formal · <tspan font-style="italic">ti, tvoj</tspan>, -š verbs → casual</text>
<text x="420" y="447" font-size="13" fill="#888780">a first word ending in -ite is a formal command</text>
</g>
<g>
<rect x="64" y="482" width="772" height="68" rx="10" fill="#534AB7"/>
<rect x="88" y="504" width="22" height="22" rx="3" fill="#FFFFFF" transform="rotate(45 99 515)"/>
<text x="124" y="510" font-size="15" font-weight="600" fill="#FFFFFF">Match</text>
<text x="124" y="531" font-size="13" fill="#CECBF6">Do all the labels fit?</text>
<rect x="420" y="498" width="196" height="36" rx="18" fill="#E1F5EE"/>
<text x="518" y="521" font-size="13" font-weight="600" fill="#085041" text-anchor="middle">yes → pick it · 37 / 40</text>
<rect x="628" y="498" width="192" height="36" rx="18" fill="#3C3489"/>
<text x="724" y="521" font-size="13" font-weight="600" fill="#EEEDFE" text-anchor="middle">no → next option ↻</text>
</g>

<line x1="450" y1="576" x2="450" y2="612" stroke="#B4B2A9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="464" y="598" font-size="13" fill="#888780">none of the 32 fit</text>

<g>
<rect x="40" y="620" width="820" height="84" rx="12" fill="#FFFFFF" stroke="#9FE1CB"/>
<circle cx="72" cy="662" r="14" fill="#E1F5EE"/><text x="72" y="667" font-size="13" font-weight="600" fill="#0F6E56" text-anchor="middle">4</text>
<text x="100" y="656" font-size="15" font-weight="600" fill="#1F1E1C">Repair the endings</text>
<text x="100" y="677" font-size="13" fill="#6B6A65">best option first</text>
<text x="420" y="648" font-size="13" fill="#3D3D3A"><tspan font-style="italic">proverio → proverila</tspan> · <tspan font-style="italic">došao → došla</tspan> (19 irregular verbs)</text>
<text x="420" y="668" font-size="13" fill="#3D3D3A"><tspan font-style="italic">proverila → proverio</tspan> · <tspan font-style="italic">umrla → umro</tspan></text>
<text x="420" y="688" font-size="13" fill="#3D3D3A"><tspan font-style="italic">ti → Vi</tspan> · <tspan font-style="italic">tvoj → Vaš</tspan> · <tspan font-style="italic">Vas → tebe</tspan> or <tspan font-style="italic">te</tspan></text>
</g>

<line x1="450" y1="710" x2="450" y2="732" stroke="#B4B2A9" stroke-width="1.6" marker-end="url(#a)"/>

<g>
<rect x="40" y="740" width="820" height="68" rx="12" fill="#0F6E56"/>
<rect x="64" y="762" width="22" height="22" rx="3" fill="#FFFFFF" transform="rotate(45 75 773)"/>
<text x="100" y="768" font-size="15" font-weight="600" fill="#FFFFFF">Repair</text>
<text x="100" y="789" font-size="13" fill="#9FE1CB">Does it fit now?</text>
<rect x="420" y="756" width="196" height="36" rx="18" fill="#E1F5EE"/>
<text x="518" y="779" font-size="13" font-weight="600" fill="#085041" text-anchor="middle">yes → use it · 2 / 40</text>
<rect x="628" y="756" width="216" height="36" rx="18" fill="#FAECE7"/>
<text x="736" y="779" font-size="13" font-weight="600" fill="#712B13" text-anchor="middle">no → “had to guess” · 1 / 40</text>
</g>

<text x="40" y="830" font-size="12" fill="#888780">Counts are the 40 test sentences that check gender or formality (5 control sentences have nothing to check).</text>
</svg>
