<svg xmlns="http://www.w3.org/2000/svg" width="900" height="830" viewBox="0 0 900 830" role="img">
<title>How the picker chooses a Serbian translation</title>
<desc>A vertical flow with a worked example. NLLB writes 32 Serbian options. For each option, best first: find the helper word (sam or si), read the ending next to it, read the word for "you". Match: do all labels fit? Yes: keep it (37 of 40 test sentences). No: try the next option. If none of the 32 fit, Repair: can a rule fix an ending? Yes: use the fix (2 of 40). No: show the top answer with a "had to guess" warning (1 of 40).</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2B2723" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B83E26" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A847C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="900" height="830" fill="#FFFEFC"/>

<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="40" y="34" font-size="12" font-weight="600" fill="#8A847C" letter-spacing="1.4">FIGURE 1</text>
<text x="40" y="66" font-size="26" fill="#2B2723" font-family="'Iowan Old Style', Charter, Georgia, serif">How the picker chooses a Serbian translation</text>
<text x="230" y="108" font-size="12" font-weight="600" fill="#8A847C" letter-spacing="1">STEP</text>
<text x="560" y="108" font-size="12" font-weight="600" fill="#8A847C" letter-spacing="1">WORKED EXAMPLE</text>
<line x1="40" y1="120" x2="860" y2="120" stroke="#E6E1D8"/>

<line x1="200" y1="150" x2="200" y2="524" stroke="#2B2723" stroke-width="1.4" marker-end="url(#ink)"/>
<line x1="200" y1="552" x2="200" y2="624" stroke="#8A847C" stroke-width="1.4" marker-end="url(#gray)"/>
<line x1="200" y1="656" x2="200" y2="722" stroke="#8A847C" stroke-width="1.4" marker-end="url(#gray)"/>
<path d="M190 540 H128 Q118 540 118 530 V330 Q118 320 128 320 H192" fill="none" stroke="#8A847C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#gray)"/>

<circle cx="200" cy="150" r="5.5" fill="#2B2723"/>
<circle cx="200" cy="230" r="5.5" fill="#2B2723"/>
<circle cx="200" cy="320" r="5.5" fill="#FFFEFC" stroke="#2B2723" stroke-width="1.6"/>
<circle cx="200" cy="390" r="5.5" fill="#FFFEFC" stroke="#2B2723" stroke-width="1.6"/>
<circle cx="200" cy="460" r="5.5" fill="#FFFEFC" stroke="#2B2723" stroke-width="1.6"/>
<rect x="190" y="530" width="20" height="20" fill="#FFFEFC" stroke="#B83E26" stroke-width="1.8" transform="rotate(45 200 540)"/>
<rect x="190" y="630" width="20" height="20" fill="#FFFEFC" stroke="#B83E26" stroke-width="1.8" transform="rotate(45 200 640)"/>
<circle cx="200" cy="732" r="6" fill="#FFFEFC" stroke="#8A847C" stroke-width="1.6" stroke-dasharray="3 2"/>

<text x="230" y="155" font-size="16" font-weight="600" fill="#2B2723">Mandarin, plus who is talking</text>
<text x="230" y="177" font-size="14" fill="#6E685F">the user sets speaker, listener and formality</text>
<text x="560" y="156" font-size="19" fill="#2B2723">我已经检查过这台机器了</text>
<text x="560" y="178" font-size="13" fill="#8A847C">speaker: woman</text>

<text x="230" y="235" font-size="16" font-weight="600" fill="#2B2723">NLLB writes 32 Serbian options</text>
<text x="230" y="257" font-size="14" fill="#6E685F">most likely first</text>
<g font-family="'Iowan Old Style', Charter, Georgia, serif" font-size="16">
<text x="560" y="234" fill="#A39D94"><tspan font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">1</tspan><tspan dx="6"></tspan> Ja sam pregledao ovu mašinu</text>
<text x="560" y="256" fill="#A39D94"><tspan font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">2</tspan><tspan dx="6"></tspan> Proverio sam ovu mašinu</text>
<text x="560" y="278" fill="#2B2723"><tspan font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">14</tspan><tspan dx="6"></tspan> Već sam proverila ovu mašinu</text>
</g>

<text x="230" y="325" font-size="16" font-weight="600" fill="#2B2723">Find the helper word</text>
<text x="230" y="347" font-size="14" fill="#6E685F"><tspan font-style="italic">sam</tspan> (I am) points to the speaker, <tspan font-style="italic">si</tspan> to the listener</text>
<text x="560" y="326" font-size="18" fill="#2B2723" font-family="'Iowan Old Style', Charter, Georgia, serif">Već <tspan fill="#B83E26" font-weight="700">sam</tspan> proverila ovu mašinu</text>

<text x="230" y="395" font-size="16" font-weight="600" fill="#2B2723">Read the ending next to it</text>
<text x="230" y="417" font-size="14" fill="#6E685F">-o, -ao: a man · -la: a woman</text>
<text x="560" y="396" font-size="19" fill="#2B2723" font-family="'Iowan Old Style', Charter, Georgia, serif">proveri<tspan fill="#B83E26" font-weight="700">la</tspan><tspan font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6E685F">   →  a woman is speaking</tspan></text>

<text x="230" y="465" font-size="16" font-weight="600" fill="#2B2723">Read the word for “you”</text>
<text x="230" y="487" font-size="14" fill="#6E685F"><tspan font-style="italic">Vi, Vaš</tspan>: formal · <tspan font-style="italic">ti, tvoj</tspan>: casual</text>
<text x="560" y="466" font-size="14" fill="#8A847C">no “you” here, so nothing to check</text>

<text x="230" y="545" font-size="16" font-weight="600" fill="#B83E26">Match: do all labels fit?</text>
<line x1="462" y1="540" x2="548" y2="540" stroke="#B83E26" stroke-width="1.4" marker-end="url(#red)"/>
<text x="505" y="531" font-size="13" fill="#B83E26" text-anchor="middle">yes</text>
<text x="560" y="546" font-size="18" fill="#B83E26" font-family="'Iowan Old Style', Charter, Georgia, serif">Već sam proverila ovu mašinu</text>
<text x="560" y="568" font-size="13" fill="#8A847C">kept as is · 37 of 40 test sentences</text>
<text x="108" y="420" font-size="13" fill="#8A847C" text-anchor="end">no: try the</text>
<text x="108" y="438" font-size="13" fill="#8A847C" text-anchor="end">next option</text>
<text x="212" y="594" font-size="13" fill="#8A847C">none of the 32 fit</text>

<text x="230" y="645" font-size="16" font-weight="600" fill="#B83E26">Repair: can a rule fix it?</text>
<text x="230" y="667" font-size="14" fill="#6E685F"><tspan font-style="italic">proverio → proverila</tspan> · <tspan font-style="italic">ti → Vi</tspan> · <tspan font-style="italic">tvoj → Vaš</tspan></text>
<line x1="462" y1="640" x2="548" y2="640" stroke="#B83E26" stroke-width="1.4" marker-end="url(#red)"/>
<text x="505" y="631" font-size="13" fill="#B83E26" text-anchor="middle">yes</text>
<text x="560" y="646" font-size="19" fill="#2B2723" font-family="'Iowan Old Style', Charter, Georgia, serif"><tspan fill="#A39D94">dodao</tspan> → doda<tspan fill="#B83E26" font-weight="700">la</tspan> sam</text>
<text x="560" y="668" font-size="13" fill="#8A847C">ending rewritten · 2 of 40</text>
<text x="212" y="698" font-size="13" fill="#8A847C">no</text>

<text x="230" y="737" font-size="16" font-weight="600" fill="#2B2723">Show the top answer with a warning</text>
<text x="230" y="759" font-size="14" fill="#6E685F">flagged “had to guess” · 1 of 40</text>
<text x="560" y="738" font-size="19" fill="#A39D94" font-family="'Iowan Old Style', Charter, Georgia, serif">Ne, ne, ne…</text>
<text x="560" y="760" font-size="13" fill="#8A847C">NLLB broke down on this one</text>

<line x1="40" y1="784" x2="860" y2="784" stroke="#E6E1D8"/>
<text x="40" y="804" font-size="12.5" fill="#8A847C">Counts are for the 40 test sentences that check gender or formality; 5 control sentences have nothing to check.</text>
<text x="40" y="822" font-size="12.5" fill="#8A847C">Every rule and word list comes from our Serbian speaker.</text>
</g>
</svg>
