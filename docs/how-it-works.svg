<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 900 1040" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How the picker works, step by step</title>
<desc>NLLB writes 32 Serbian options. For each option in order: find the helper word sam or si, read the endings next to it for gender, read the words for "you" for formality, then decide Match: do all labels fit? Yes: pick it (37 of 40 test sentences). No: try the next option. If none of the 32 fit, Repair rewrites the endings with our Serbian speaker's rules and checks again. Fits now: use it (2 of 40). Otherwise show NLLB's top answer with a "had to guess" warning (1 of 40).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="1040" fill="#FFFFFF"/>

<g stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
<line x1="290" y1="76" x2="290" y2="98"/>
<line x1="290" y1="156" x2="290" y2="178"/>
<line x1="290" y1="224" x2="290" y2="246"/>
<line x1="290" y1="304" x2="290" y2="326"/>
<line x1="290" y1="384" x2="290" y2="406"/>
<line x1="290" y1="464" x2="290" y2="488"/>
<line x1="420" y1="535" x2="478" y2="535"/>
<line x1="290" y1="580" x2="290" y2="608"/>
<path d="M160 655 L70 655 L70 202 L138 202"/>
<line x1="290" y1="700" x2="290" y2="728"/>
<line x1="290" y1="786" x2="290" y2="808"/>
<line x1="420" y1="855" x2="478" y2="855"/>
<line x1="290" y1="900" x2="290" y2="928"/>
</g>
<g stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3">
<line x1="440" y1="276" x2="480" y2="276"/>
<line x1="440" y1="356" x2="480" y2="356"/>
<line x1="440" y1="436" x2="480" y2="436"/>
<line x1="440" y1="758" x2="480" y2="758"/>
</g>

<g text-anchor="middle" dominant-baseline="central">
<rect x="140" y="20" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="290" y="38" fill="#444441" font-size="14" font-weight="600">Mandarin + who's talking</text>
<text x="290" y="58" fill="#5F5E5A" font-size="13">我已经检查过了 · woman speaker</text>
<rect x="140" y="100" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="290" y="118" fill="#444441" font-size="14" font-weight="600">NLLB writes 32 Serbian options</text>
<text x="290" y="138" fill="#5F5E5A" font-size="13">ranked from most to least likely</text>
<rect x="140" y="180" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="290" y="202" fill="#444441" font-size="14" font-weight="600">Take the next option</text>

<rect x="140" y="248" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="290" y="266" fill="#3C3489" font-size="14" font-weight="600">1. Find the helper word</text>
<text x="290" y="286" fill="#534AB7" font-size="13">sam (I am) · si (you are)</text>
<rect x="140" y="328" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="290" y="346" fill="#3C3489" font-size="14" font-weight="600">2. Read the endings next to it</text>
<text x="290" y="366" fill="#534AB7" font-size="13">gives speaker and listener gender</text>
<rect x="140" y="408" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="290" y="426" fill="#3C3489" font-size="14" font-weight="600">3. Read the words for "you"</text>
<text x="290" y="446" fill="#534AB7" font-size="13">gives formal or casual</text>

<polygon points="160,535 290,490 420,535 290,580" fill="#534AB7" stroke="#3C3489" stroke-width="0.8"/>
<text x="290" y="526" fill="#FFFFFF" font-size="15" font-weight="600">Match</text>
<text x="290" y="546" fill="#EEEDFE" font-size="13">Do all labels fit?</text>
<rect x="480" y="507" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="600" y="525" fill="#085041" font-size="14" font-weight="600">Pick this option</text>
<text x="600" y="545" fill="#0F6E56" font-size="13">37 of 40 sentences</text>

<polygon points="160,655 290,610 420,655 290,700" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="290" y="646" fill="#444441" font-size="14" font-weight="600">Options left?</text>
<text x="290" y="666" fill="#5F5E5A" font-size="13">out of the 32</text>

<rect x="140" y="730" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="290" y="748" fill="#085041" font-size="14" font-weight="600">4. Repair: rewrite the endings</text>
<text x="290" y="768" fill="#0F6E56" font-size="13">best option first</text>

<polygon points="160,855 290,810 420,855 290,900" fill="#0F6E56" stroke="#085041" stroke-width="0.8"/>
<text x="290" y="846" fill="#FFFFFF" font-size="15" font-weight="600">Repair</text>
<text x="290" y="866" fill="#E1F5EE" font-size="13">Does it fit now?</text>
<rect x="480" y="827" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text x="600" y="845" fill="#085041" font-size="14" font-weight="600">Use it, marked "repaired"</text>
<text x="600" y="865" fill="#0F6E56" font-size="13">2 of 40 sentences</text>

<rect x="140" y="930" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="290" y="948" fill="#712B13" font-size="14" font-weight="600">NLLB's top answer + warning</text>
<text x="290" y="968" fill="#993C1D" font-size="13">"had to guess" · 1 of 40 sentences</text>
</g>

<g font-size="13">
<rect x="480" y="240" width="380" height="72" rx="8" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.8"/>
<text x="494" y="260" fill="#3C3489">sam, nisam → the speaker; si, jesi, nisi → the listener</text>
<text x="494" y="278" fill="#3C3489">look 1 word before and up to 3 after it</text>
<text x="494" y="296" fill="#534AB7">skip "Sam" meaning "alone"; stop at da, što, a comma</text>
<rect x="480" y="320" width="380" height="72" rx="8" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.8"/>
<text x="494" y="340" fill="#3C3489">-o, -ao, -eo, -io, -uo → man (proverio, došao)</text>
<text x="494" y="358" fill="#3C3489">-la → woman (proverila, došla)</text>
<text x="494" y="376" fill="#534AB7">word list: umoran / umorna; skip kao, posao, škola</text>
<rect x="480" y="400" width="380" height="72" rx="8" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.8"/>
<text x="494" y="420" fill="#3C3489">Vi, Vas, Vaš, ste, biste → formal</text>
<text x="494" y="438" fill="#3C3489">ti, tebe, tvoj, si, verbs ending in -š → casual</text>
<text x="494" y="456" fill="#534AB7">first word -ite → formal command, -i → casual</text>
<rect x="480" y="722" width="380" height="72" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.8"/>
<text x="494" y="742" fill="#085041">man → woman: proverio → proverila, došao → došla</text>
<text x="494" y="760" fill="#085041">woman → man: proverila → proverio, umrla → umro</text>
<text x="494" y="778" fill="#085041">casual ↔ formal: ti → Vi, tvoj → Vaš, Vas → tebe</text>
</g>

<g font-size="13" fill="#5F5E5A">
<text x="440" y="524" text-anchor="middle">yes</text>
<text x="440" y="844" text-anchor="middle">yes</text>
<text x="300" y="594">no</text>
<text x="300" y="714">no</text>
<text x="300" y="914">no</text>
<text x="80" y="640">yes</text>
<text x="80" y="1018">40 test sentences check gender or formality (5 controls have nothing to check). All rules come from our Serbian speaker.</text>
</g>
</svg>
