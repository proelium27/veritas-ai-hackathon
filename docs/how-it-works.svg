<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1080" viewBox="0 0 860 1080" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="none">
<title>Flowchart of how the picker chooses a Serbian translation</title>
<desc>Start. Input: Mandarin sentence and who is talking. NLLB writes 32 Serbian options. Take the next option. Find the helper word (sam or si). Read the endings. Read the words for "you". Decision: do the labels fit? Yes: keep this option (37 of 40). No: decision: options left? Yes: take the next option. No: repair the endings. Decision: fits now? Yes: use the repaired sentence (2 of 40). No: use the top answer with a warning (1 of 40). Output: Serbian translation. End.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#1F1F1F"/></marker></defs>
<rect width="860" height="1080" fill="#FFFFFF"/>

<g stroke="#1F1F1F" stroke-width="1.4" marker-end="url(#a)">
<line x1="300" y1="70" x2="300" y2="88"/>
<line x1="300" y1="140" x2="300" y2="158"/>
<line x1="300" y1="208" x2="300" y2="226"/>
<line x1="300" y1="270" x2="300" y2="288"/>
<line x1="300" y1="332" x2="300" y2="350"/>
<line x1="300" y1="394" x2="300" y2="412"/>
<line x1="300" y1="456" x2="300" y2="474"/>
<line x1="400" y1="522" x2="528" y2="522"/>
<line x1="300" y1="570" x2="300" y2="596"/>
<path d="M200 642 H90 V249 H148"/>
<line x1="300" y1="688" x2="300" y2="714"/>
<line x1="300" y1="758" x2="300" y2="780"/>
<line x1="400" y1="828" x2="528" y2="828"/>
<line x1="300" y1="876" x2="300" y2="896"/>
<line x1="300" y1="952" x2="300" y2="964"/>
<path d="M752 522 H800 V988 H432"/>
<line x1="300" y1="1012" x2="300" y2="1028"/>
</g>
<line x1="752" y1="828" x2="800" y2="828" stroke="#1F1F1F" stroke-width="1.4"/>

<g stroke="#1F1F1F" stroke-width="1.4" fill="#FFFFFF">
<rect x="230" y="30" width="140" height="40" rx="20"/>
<polygon points="190,90 430,90 410,140 170,140"/>
<rect x="150" y="160" width="300" height="48"/>
<rect x="150" y="228" width="300" height="42"/>
<rect x="150" y="290" width="300" height="42"/>
<rect x="150" y="352" width="300" height="42"/>
<rect x="150" y="414" width="300" height="42"/>
<polygon points="300,476 400,522 300,568 200,522"/>
<rect x="530" y="498" width="222" height="48"/>
<polygon points="300,598 400,642 300,686 200,642"/>
<rect x="150" y="716" width="300" height="42"/>
<polygon points="300,782 400,828 300,874 200,828"/>
<rect x="530" y="804" width="222" height="48"/>
<rect x="150" y="898" width="300" height="54"/>
<polygon points="190,966 430,966 410,1010 170,1010"/>
<rect x="230" y="1030" width="140" height="40" rx="20"/>
</g>

<g fill="#1F1F1F" text-anchor="middle" dominant-baseline="central">
<text x="300" y="50">Start</text>
<text x="300" y="115">Mandarin + who's talking</text>
<text x="300" y="184">NLLB writes 32 Serbian options</text>
<text x="300" y="249">Take the next option</text>
<text x="300" y="311">Find the helper word (sam / si)</text>
<text x="300" y="373">Read the endings (-o man, -la woman)</text>
<text x="300" y="435">Read “you” words (Vi formal, ti casual)</text>
<text x="300" y="522">Labels fit?</text>
<text x="641" y="514">Keep this option</text>
<text x="641" y="533" font-size="13" fill="#666666">37 of 40</text>
<text x="300" y="642">Options left?</text>
<text x="300" y="737">Repair the endings</text>
<text x="300" y="828">Fits now?</text>
<text x="641" y="820">Use the repaired sentence</text>
<text x="641" y="839" font-size="13" fill="#666666">2 of 40</text>
<text x="300" y="915">Use top answer + warning</text>
<text x="300" y="936" font-size="13" fill="#666666">“had to guess” · 1 of 40</text>
<text x="300" y="988">Serbian translation</text>
<text x="300" y="1050">End</text>
</g>

<g fill="#1F1F1F" font-size="13">
<text x="410" y="512">Yes</text>
<text x="310" y="586">No</text>
<text x="160" y="632">Yes</text>
