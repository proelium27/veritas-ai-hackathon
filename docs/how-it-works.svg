<line x1="753" y1="847" x2="909" y2="847"/>
<line x1="529" y1="911" x2="529" y2="929"/>
<line x1="529" y1="1013" x2="529" y2="1032"/>
<path d="M1230 445 H1326 V1088 H748"/>
<line x1="529" y1="1142" x2="529" y2="1161"/>
</g>
<line x1="1230" y1="847" x2="1326" y2="847" stroke="#1A1A1A" stroke-width="1.3"/>

<g stroke="#1A1A1A" stroke-width="1.3">
<rect x="281" y="18" width="497" height="108" rx="18" fill="#DCEAD5"/>
<rect x="301" y="153" width="458" height="96" fill="#D5E2F2" stroke-width="2"/>
<rect x="301" y="277" width="457" height="82" fill="#D5E2F2"/>
<polygon points="305,445 529,381 753,445 529,509" fill="#F8E5D0"/>
<rect x="911" y="397" width="319" height="95" fill="#D5E2F2"/>
<polygon points="305,594 529,530 753,594 529,658" fill="#F8E5D0"/>
<rect x="301" y="679" width="457" height="82" fill="#D5E2F2"/>
<polygon points="305,847 529,783 753,847 529,911" fill="#F8E5D0"/>
